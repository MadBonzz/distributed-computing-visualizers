<script>
'use strict';
const MODES={
 paxos:{name:'Paxos · acceptor recovery',group:'Consensus',icon:'⬡',desc:'Independent Paxos slots. Competing proposers, persisted promises and accepted values, reordering, crash/recovery, and majority selection.',help:'<b>Key scenario:</b> Seed an acceptor with acceptedBallot=5 and value=A, crash it, then start a new proposer with a higher ballot. A new leader must adopt the highest-ballot value from its majority of promises. <b>Guarantee:</b> safety with unique ballots and durable acceptor state; progress requires a stable leader and reachable majority.',src:'Week 7 — Paxos',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/notes/Week7.pdf'},
 benor:{name:'Ben-Or · randomized consensus',group:'Consensus',icon:'🎲',desc:'Two-phase asynchronous binary consensus with n−f first-arrival thresholds and controllable coin tosses.',help:'<b>Schedule first arrivals carefully.</b> Each node uses only the first n−f distinct A and B messages of its current round. If B has no definite value, a fair random coin selects its next estimate (or override the coin for adversarial exploration). <b>Guarantee:</b> agreement for f &lt; n/2 with eventual delivery; termination with probability 1 under fair independent coins.',src:'Week 12 — randomized consensus',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/notes/Week12%20(MW).pdf'},
 sync:{name:'Crash consensus · f+1 rounds',group:'Consensus',icon:'≋',desc:'Synchronous min-value flooding: crash nodes during a round after transmitting to only a chosen subset.',help:'<b>Dangerous chains:</b> in each round a process relays newly learned values. A crash in the middle of a round may send to only some peers. With at most f crashes and reliable synchronized rounds, survivors decide min(known values) after f+1 rounds. Network omission without crash violates the model.',src:'Week 6 — synchronous consensus',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/notes/Week6.pdf#page=30'},
 trb:{name:'Terminating reliable broadcast',group:'Broadcast',icon:'◎',desc:'Synchronous crash-fault broadcast with a distinguished source and failure symbol SF after f+1 rounds.',help:'<b>Source may crash after a partial send.</b> A receiver delivers the source value as soon as it arrives and relays it in the next round if one remains. In basic TRB, a process still waiting in the final round delivers SF. A correct sender always reaches correct nodes. Under f crash faults all correct survivors agree.',src:'Week 6 — TRB',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/notes/Week6.pdf#page=47'},
 brb:{name:'Bracha · Byzantine reliable broadcast',group:'Broadcast',icon:'✳',desc:'Asynchronous Byzantine broadcast with INIT / ECHO / READY, equivocation, and f < n/3 authenticated-sender fault tolerance.',help:'<b>Failure types:</b> a Byzantine sender may send conflicting INIT values, and any Byzantine process may forge different ECHO/READY contents to different recipients (but cannot impersonate another sender). Honest nodes echo at most one value, READY after n−f ECHOs or f+1 READYs, and deliver after 2f+1 READYs. Sender-faulty runs may never terminate. <b>Guarantee:</b> honest recipients agree if n > 3f and messages between correct nodes are eventually delivered.',src:'Byzantine broadcast — supplemental Bracha algorithm',url:'https://algorithm.tamnd.com/bracha-reliable-broadcast/'},
 urb:{name:'Eager echo broadcast',group:'Broadcast',icon:'◉',desc:'Crash-fault eager flooding: a node that first receives a payload rebroadcasts it and delivers. Compare with terminating broadcast.',help:'<b>Crash versus channel loss:</b> sending to a subset and then crashing is allowed; a correct recipient can forward. It provides a crash-fault echo broadcast demonstration, not a full Byzantine reliable broadcast or guaranteed delivery of SF when a source crashes.',src:'Supplemental forwarding example; schedule for context',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/schedule.html'},
 snapshot:{name:'Chandy–Lamport · snapshot',group:'Global state',icon:'◫',desc:'Record a consistent global cut across FIFO channels; observe the messages captured as in-transit channel state.',help:'<b>Important:</b> A snapshot records each process once. The first marker on an incoming channel closes that channel; while other incoming channels are still open, arriving application messages are recorded as in transit. This simulator enforces FIFO order per directed channel. Snapshot correctness assumes reliable channels and no process failures.',src:'Week 3 — snapshot protocol',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/notes/Week3.pdf'},
 clocks:{name:'Lamport & vector clocks',group:'Global state',icon:'↗',desc:'Generate local events, send messages and deliver them in adversarial orders; compare scalar and vector timestamps.',help:'<b>Vector clocks:</b> local/send increment the owner component. Receive takes componentwise maximum, then increments the receiver component. If neither vector dominates, events are concurrent. A larger Lamport clock alone does not imply causality.',src:'Week 4 — vector clocks and causality',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/notes/Week4.pdf'},
 twopc:{name:'Two-phase commit · 2PC',group:'Atomic commit',icon:'②',desc:'Coordinator voting, durable logging, uncertain participants, coordinator crash, recovery, and cooperative termination.',help:'<b>Blocking case:</b> Have everyone vote YES, crash the coordinator before its logged decision, and let prepared participants ask one another. Nobody can safely choose commit versus abort. A logged YES vote survives a crash. No vote or a recorded NO permits abort.',src:'Week 10 — atomic commit',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/notes/Week10.pdf'},
 threepc:{name:'Three-phase commit · 3PC',group:'Atomic commit',icon:'③',desc:'PRECOMMIT, ACK, leader change, and state collection under crash-only synchronous assumptions.',help:'<b>Try:</b> Collect YES votes → deliver PRECOMMIT to a subset → crash the coordinator → elect another node → collect states. If a committable state exists, new coordinator advances others before committing. This simplified Skeen variant assumes known crash failures, reliable communication and no partitions; 3PC is unsafe with arbitrary partitions.',src:'Weeks 10–11 — Skeen 3PC',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/notes/Week11.pdf'},
 detector:{name:'Heartbeat failure detector',group:'Failures & replication',icon:'♡',desc:'Delay heartbeats, crash nodes, tune suspicion timeouts, and inspect false positives or eventual detection.',help:'<b>Distinguish suspected from crashed.</b> Timeouts are evidence, not proof. Slow delivery can create false suspicions even when nodes are healthy. Under partial synchrony and an eventually adequate timeout, failure detectors can become accurate.',src:'Failure detector topic on the course schedule; illustrative heartbeat model',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/schedule.html'},
 primary:{name:'Primary–backup replication',group:'Failures & replication',icon:'⇉',desc:'Forward writes, acknowledge backups and elect a lagging primary to see what goes wrong without fencing.',help:'<b>Study lost writes:</b> Start a write from primary P0, delay replication, crash P0, promote a lagging backup. This illustrates why primary–backup requires correct failover/fencing, committed-prefix and state-transfer rules. It is deliberately a cautionary teaching model, not a full production protocol.',src:'Week 5 — primary-backup',url:'https://www.cs.cornell.edu/courses/cs5414/2026fa/notes/Week5.pdf'}
};
const groupOrder=['Consensus','Broadcast','Atomic commit','Global state','Failures & replication'];
let restartPoint=null;
let receiving=null;
let S=null,undoStack=[],selection=0,autoDraft={},graphFocus=false;const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idname=i=>'P'+i,alive=i=>S.nodes[i]?.alive,validId=i=>Number.isInteger(i)&&i>=0&&i<S.n;
function log(t,kind='normal'){S.logs.unshift({t:String(t),kind,at:S.time});if(S.logs.length>350)S.logs.length=350}
function checkpoint(){undoStack.push(JSON.stringify(S));if(undoStack.length>80)undoStack.shift()}
function mutate(f){
  checkpoint();S.options.lastStep='';
  const previousRound=S.round;receiving=[];
  try{f()}catch(e){log('ERROR: '+e.message,'failure');console.error(e)}
  const arrived=receiving;receiving=null;
  if(arrived.length)S.options.lastArrivals=arrived;
  S.time++;render();
  const traffic=isAsync()?arrived:S.round>previousRound?S.history.at(-1)?.outgoing.filter(m=>m.values.length):[];
  animateArrivals(traffic||[]);
}
function send(from,to,type,payload={}){if(!validId(from)||!validId(to))return;S.seq++;S.queue.push({id:S.seq,from,to,type,payload:structuredClone(payload)});log(`→ ${idname(from)} → ${idname(to)}  ${type}`,'note')}
function broadcast(from,type,payload={},recipients=null){(recipients||Array.from({length:S.n},(_,i)=>i)).forEach(to=>send(from,to,type,payload))}
function numberOr(v,d=0){let x=Number(v);return Number.isFinite(x)?x:d}
function baseNode(i){return {id:i,alive:true,input:i%2,value:i%2, vote:'YES',state:'INIT',decided:null,log:[],promised:-1,acceptedB:-1,acceptedV:null,sessions:{}, learned:null,local:10,recorded:false,snapshotLocal:null,channels:{},closed:{},clock:0,vector:[],recvA:{},recvB:{},round:1,phase:'idle',a:i%2,b:null,coin:'random',sent:{},byzantine:false,echoed:null,readied:null,firstInit:null,echos:{},readies:{},known:new Set(),partial:'',crashNext:false,last:{},suspects:[],logIndex:0,committed:0,pendingWrites:{},role:'backup',delivered:null,heard:false}}
function init(mode='paxos',n=5,f=2){n=Math.max(2,Math.min(10,Math.trunc(numberOr(n,5))));f=Math.max(0,Math.min(n-1,Math.trunc(numberOr(f,2))));let m=MODES[mode]?mode:'paxos';S={mode:m,n,f,nodes:Array.from({length:n},(_,i)=>baseNode(i)),queue:[],logs:[],seq:0,time:0,started:false,round:0,chosen:[],initialTotal:n*10,coordinator:0,election:null,source:0,msgValue:'DATA',protocolFaults:[],heartbeatTick:0,heartbeatTimeout:2,network:{},voteRecord:{},crashed:0,history:[],options:{}};
 currentExample=-1;restartPoint=null;dismissNode();normalizePaxos(S);
 S.nodes.forEach(p=>{if(m==='sync')p.input=([3,1,4,2][p.id]??p.id+1);p.vector=Array(n).fill(0);p.known=[p.input];p.last={};p.sent={};p.partial='';p.role=p.id===0?'primary':'backup';p.committed=0;for(let j=0;j<n;j++){if(j!==p.id){p.closed[j]=false;p.channels[j]=[]}p.last[j]=0}});if(mode==='trb')S.nodes.forEach(p=>p.known=[]);if(mode==='urb')S.nodes.forEach(p=>p.known=[]);if(mode==='benor')S.nodes.forEach(p=>p.phase='idle');if(mode==='detector')S.nodes.forEach(p=>p.suspects=[]);if(mode==='primary')S.nodes.forEach(p=>{p.state='READY';p.value='0'});undoStack=[];selection=0;autoDraft={};log(`New ${MODES[m].name} · n=${n}, f=${f}`,'note');render()}
function canDeliver(m){if(!alive(m.to)||S.network[m.from+'-'+m.to])return false;if(S.mode==='snapshot'){let prior=S.queue.some(q=>q.id<m.id&&q.from===m.from&&q.to===m.to);if(prior)return false;}return true}
function deliver(id){let idx=S.queue.findIndex(x=>x.id===id);if(idx<0)return;let msg=S.queue[idx];if(!canDeliver(msg)){log(`Cannot deliver #${id}: receiver down, link blocked or FIFO predecessor outstanding`,'alert');return}S.queue.splice(idx,1);receiving?.push({from:msg.from,to:msg.to,type:msg.type,payload:msg.payload});log(`✓ #${id} ${idname(msg.from)} → ${idname(msg.to)} ${msg.type}${msg.payload.slot!=null?' · slot '+msg.payload.slot:''}`);handleMessage(msg);}
function doDeliver(id){restartPoint??=captureRun();mutate(()=>deliver(id))}

function dropMessage(id){mutate(()=>{let p=S.queue.findIndex(x=>x.id===id);if(p>=0){let m=S.queue.splice(p,1)[0];log(`✕ Dropped #${id}: ${m.type} ${idname(m.from)}→${idname(m.to)}`,'alert');if(['sync','trb','snapshot','paxos','benor','twopc','threepc'].includes(S.mode))S.protocolFaults.push('Manually dropped network messages (stronger than assumed model).')}})}
function duplicateMessage(id){mutate(()=>{let m=S.queue.find(x=>x.id===id);if(m){send(m.from,m.to,m.type,m.payload);log(`Duplicated message #${id}`,'alert')}})}
function moveMessage(id,dir){mutate(()=>{let a=S.queue.findIndex(x=>x.id===id),b=a+dir;if(a>=0&&b>=0&&b<S.queue.length){[S.queue[a],S.queue[b]]=[S.queue[b],S.queue[a]];log(`Reordered #${id}`,'note')}})}

// Each slot is a separate Paxos instance. Editing the view never reroutes a message.

function suggestedBallot(id){

function paxosReceive(m){

}

// ─── VECTOR + LAMPORT CLOCKS ───
function clockStep(id,kind='LOCAL',to=null){let p=S.nodes[id];if(!p.alive)return;p.clock++;p.vector[id]++;let vc=[...p.vector],lc=p.clock;if(kind==='SEND'&&validId(to)&&id!==to){send(id,to,'CLOCK',{lc,vc});}S.history.push({id,kind,lc,vc,to});log(`${idname(id)} ${kind} · L=${lc}, V=[${vc.join(',')}]`,'note')}

// ─── BEN-OR: the 2026 notes' two-phase variant ───

function benPanel(){

// ─── CRASH CONSENSUS / TRB: synchronous rounds with partial final sends ───
function parseRecipients(str){if(!str||!str.trim())return [];return [...new Set(str.split(/[\s,]+/).filter(Boolean).map(x=>Number(String(x).replace(/^p/i,''))).filter(validId))]}

function syncRound(){
  if (!S.started) syncStart();
  if (roundsFinished()) return;
  const round = S.round + 1;
  const trb = S.mode === 'trb';
  const early = trb && S.options.earlyStopping;
  const outgoing = [], fail = [], learned = {};
  const live = S.nodes.filter(p => p.alive);
  for (const p of live) {
    if (trb && p.halted) continue;
    const willCrash = p.crashNext || p.crashRound === round;
    const recipients = willCrash ? parseRecipients(p.partial) : live.map(q => q.id);
    let values = p.known.filter(v => !p.sent[JSON.stringify(v)]);
    if (trb) {
      if (early) values = p.id === S.source && p.deliveryRound != null ? [] : p.decided === 'SF' ? ['SF'] : [...p.known];
      else if (p.id === S.source && round === 1) values = [S.msgValue];
      else if (p.id !== S.source && p.deliveryRound === round - 1) values = [p.decided];
      else values = [];
    }
    for (const to of recipients) {
      if (to === p.id || !alive(to)) continue;
      if (S.network[p.id+'-'+to]) {
        if(values.length || early)S.options.missedRoundTraffic=true;
        continue;
      }
      if (trb && !early && !values.length) continue;
      outgoing.push({from:p.id, to, values:[...values]});
    }
    for (const v of values) p.sent[JSON.stringify(v)] = true;
    if (willCrash) fail.push(p.id);
  }
  for (const id of fail) {
    S.nodes[id].alive = false;
    S.nodes[id].crashNext = false;
    S.crashed++;
    log(`P${id} crashed during round ${round} after a partial send.`, 'failure');
  }
  for (const p of live.filter(p => p.alive && !p.halted)) {
    const packets = outgoing.filter(m => m.to === p.id);
    const before = new Set(p.known);
    for (const packet of packets) for (const v of packet.values) {
      if ((!trb || v !== 'SF') && !p.known.includes(v)) p.known.push(v);
    }
    learned[p.id] = p.known.filter(v => !before.has(v));
    if (!trb) {
      if (round === S.f + 1) p.decided = Math.min(...p.known);
    } else if (p.deliveryRound != null) {
      p.halted = true;
    } else {
      const missing = new Set(p.missing || []);
      if (early) for (const other of S.nodes) {
        if (other.id !== p.id && !packets.some(m => m.from === other.id)) missing.add(other.id);
      }
      p.missing = [...missing];
      if (p.known.length) p.decided = p.known[0];
      else if (round === S.f + 1 || (early && (missing.size < round || packets.some(m => m.values.includes('SF'))))) p.decided = 'SF';
      if (p.decided != null) {
        p.deliveryRound = round;
        p.halted = round === S.f + 1;
      }
    }
    if (p.decided != null && (!trb || p.deliveryRound === round)) log(`P${p.id} ${trb?'delivers':'decides'} ${p.decided} in round ${round}.`, 'note');

  const changes = fail.map(id => {
    const recipients = outgoing.filter(m => m.from === id && m.values.length).map(m => idname(m.to));
    return idname(id)+' crashed after sending values to '+(recipients.join(', ') || 'nobody')+'.';
  });
  const newlyDelivered = live.filter(p => p.alive && p.deliveryRound === round);
  if (trb && newlyDelivered.length) changes.push(newlyDelivered.map(p => 'P'+p.id+' delivered '+p.decided).join(', ')+'.');
  if (!trb && !changes.length) changes.push(round===S.f+1 ? 'Survivors have recorded their decisions.' : 'The green values arrived this round.');
  S.options.lastStep = 'Round '+round+' completed. '+changes.join(' ');
  S.history.push({round, outgoing, fail, learned});
  log(`Round ${round} completed with ${outgoing.length} transmissions.`, 'note');
}
function roundsFinished(){

// ─── BRACHA: authenticated Byzantine reliable broadcast ───
function brbStart(source,value){if(S.started||!alive(source))return;S.started=true;S.source=source;S.msgValue=String(value);log(`P${source} starts BRB with INIT(${value}); Byzantine source can equivocate using manual sends.`,'note');broadcast(source,'INIT',{v:String(value)})}

function brbCheck(p){if(p.byzantine||!p.alive)return;
 let values=new Set([...Object.keys(p.echos),...Object.keys(p.readies)]);
 for(let v of values){let es=p.echos[v]?.length||0,rs=p.readies[v]?.length||0;
 if(p.readied===null&&(es>=S.n-S.f||rs>=S.f+1)){p.readied=v;log(`Honest P${p.id} READY(${v}) after ${es} ECHO / ${rs} READY`,'note');broadcast(p.id,'READY',{v})}
 if(p.delivered===null&&rs>=2*S.f+1){p.delivered=v;log(`★ Honest P${p.id} RELIABLY DELIVERS ${v} with ${rs} READY votes`,'note')}
 }

function urbStart(source,value,dests){if(S.started||!alive(source))return;S.started=true;S.source=source;S.msgValue=value;let p=S.nodes[source];p.delivered=value;p.heard=true;log(`${idname(source)} broadcasts ${value} to chosen initial recipients.`,'note');for(let to of dests)if(to!==source)send(source,to,'ECHO',{v:value})}
function urbReceive(m){let p=S.nodes[m.to];if(p.heard)return;p.heard=true;p.heardFrom=m.from;p.delivered=m.payload.v;log(`${idname(p.id)} first delivers ${m.payload.v}; echoes to every process.`,'note');broadcast(p.id,'ECHO',{v:m.payload.v},S.nodes.filter(x=>x.id!==p.id).map(x=>x.id))}
// ─── 2PC / 3PC durable log and timeout / recovery ───
function commitStart(){if(S.started||!alive(0))return;S.started=true;S.coordinator=0;S.nodes[0].state='WAIT_VOTES';S.nodes[0].log.push('START');log('Coordinator P0 begins vote request','note');for(let i=1;i<S.n;i++)send(0,i,'VOTE_REQ',{})}
function commitDecision(decider,decision,why){let p=S.nodes[decider];if(p.state==='COMMITTED'||p.state==='ABORTED')return;p.state=decision==='COMMIT'?'COMMITTED':'ABORTED';p.log.push(decision);log(`★ ${idname(decider)} logs ${decision}${why?' · '+why:''}`,'note');for(let i=0;i<S.n;i++)if(i!==decider)send(decider,i,decision,{})}
function commitReceive(m){let p=S.nodes[m.to],v=m.payload,c=S.coordinator;switch(m.type){
 case 'VOTE_REQ':if(p.id===c||p.state!=='INIT')return;if(p.vote==='NO'){p.state='ABORTED';p.log.push('ABORT');send(p.id,m.from,'VOTE',{vote:'NO'});log(`${idname(p.id)} NO vote: logs ABORT`,'note')}else{p.state='PREPARED';p.log.push('YES');send(p.id,m.from,'VOTE',{vote:'YES'});log(`${idname(p.id)} logs YES, becomes uncertain (PREPARED)`,'note')}return;
 case 'VOTE':if(p.id!==c||p.state!=='WAIT_VOTES')return;S.voteRecord[m.from]=v.vote;if(v.vote==='NO'){commitDecision(c,'ABORT','one NO vote');return}if(Object.keys(S.voteRecord).length>=S.n-1){if(S.mode==='twopc'){commitDecision(c,'COMMIT','all YES votes')}else{p.state='WAIT_ACK';p.log.push('PRECOMMIT');log(`${idname(c)} logs PRECOMMIT; sends PRECOMMIT to all`,'note');for(let i=0;i<S.n;i++)if(i!==c)send(c,i,'PRECOMMIT',{})}}return;
 case 'PRECOMMIT':if(S.mode!=='threepc'||p.state==='COMMITTED'||p.state==='ABORTED')return;if(p.state==='PREPARED'||p.state==='PRECOMMIT'){if(p.state!=='PRECOMMIT')p.log.push('PRECOMMIT');p.state='PRECOMMIT';send(p.id,m.from,'ACK',{});log(`${idname(p.id)} becomes COMMITTABLE; sends ACK`,'note')}return;
 case 'ACK':if(S.mode!=='threepc'||p.id!==c||p.state!=='WAIT_ACK')return;if(!p.acks)p.acks={};p.acks[m.from]=true;let targets=(S.election&&S.election.phase==='await_ack')?S.election.targets:Array.from({length:S.n-1},(_,i)=>i+1);if(targets.every(i=>p.acks[i]))commitDecision(c,'COMMIT','all PRECOMMIT acknowledgements');return;
 case 'COMMIT':if(p.state==='ABORTED'){log(`SAFETY CONFLICT: ${idname(p.id)} is aborted but got COMMIT`,'failure');return}if(p.state!=='COMMITTED'){p.state='COMMITTED';p.log.push('COMMIT');log(`${idname(p.id)} logs COMMIT`,'note')}return;
 case 'ABORT':if(p.state==='COMMITTED'){log(`SAFETY CONFLICT: ${idname(p.id)} is committed but got ABORT`,'failure');return}if(p.state!=='ABORTED'){p.state='ABORTED';p.log.push('ABORT');log(`${idname(p.id)} logs ABORT`,'note')}return;
 case 'DECISION_REQ':if(p.state==='COMMITTED'||p.state==='ABORTED')send(p.id,m.from,'DECISION',{decision:p.state});else if(p.state==='INIT'){p.state='ABORTED';p.log.push('ABORT');send(p.id,m.from,'DECISION',{decision:'ABORTED'})}else{send(p.id,m.from,'UNKNOWN',{state:p.state})}return;
 case 'DECISION':if(p.state==='PREPARED'||p.state==='INIT'||p.state==='PRECOMMIT'){p.state=v.decision;p.log.push(v.decision);log(`${idname(p.id)} terminates after cooperative recovery: ${v.decision}`,'note')}return;
 case 'UNKNOWN':log(`${idname(m.from)} cannot resolve ${idname(m.to)}'s uncertainty (state ${v.state})`,'alert');return;
 case 'STATE_REQ':if(S.mode==='threepc')send(p.id,m.from,'STATE',{state:p.state});return;
 case 'STATE':if(S.mode==='threepc'&&S.election&&p.id===S.election.id&&S.election.phase==='collect'){S.election.states[m.from]=v.state;threepcResolve()}return;
 }}
function askDecision(id){let p=S.nodes[id];if(!p.alive)return;if(p.state!=='PREPARED'&&p.state!=='PRECOMMIT'){log('Decision requests apply to uncertain/committable participants.','alert');return}for(let i=0;i<S.n;i++)if(i!==id)send(id,i,'DECISION_REQ',{});log(`${idname(id)} starts cooperative termination; asks peers.`,'note')}
function threepcElect(id){if(S.mode!=='threepc'||!alive(id))return;S.coordinator=id;let targets=S.nodes.filter(p=>p.alive).map(p=>p.id);S.election={id,targets,states:{[id]:S.nodes[id].state},phase:'collect'};S.nodes[id].role='coordinator';log(`${idname(id)} elected replacement coordinator; collecting STATE from all known-live nodes.`, 'note');for(let i of targets)if(i!==id)send(id,i,'STATE_REQ',{});threepcResolve()}
function threepcResolve(){let e=S.election;if(!e||e.phase!=='collect'||!e.targets.every(i=>e.states[i]!==undefined))return;let statuses=Object.values(e.states),p=S.nodes[e.id];log(`Recovered states: ${JSON.stringify(e.states)}`,'note');if(statuses.includes('COMMITTED')&&statuses.includes('ABORTED')){e.phase='conflict';log('Incompatible COMMIT and ABORT states: assumptions violated or invalid seeded state.','failure');return}
 if(statuses.includes('COMMITTED')){e.phase='done';p.state='WAIT_ACK';commitDecision(e.id,'COMMIT','peer already committed');return}
 if(statuses.includes('ABORTED')){e.phase='done';p.state='WAIT_ACK';commitDecision(e.id,'ABORT','peer aborted');return}
 if(statuses.includes('PRECOMMIT')||statuses.includes('WAIT_ACK')){e.phase='await_ack';p.state='WAIT_ACK';p.acks={};e.targets=e.targets.filter(i=>i!==e.id);log('At least one COMMITTABLE node: drive all survivors through PRECOMMIT and collect ACKs.','note');for(let i of e.targets)send(e.id,i,'PRECOMMIT',{});if(e.targets.length===0)commitDecision(e.id,'COMMIT','only survivor is committable');return}
 e.phase='done';p.state='WAIT_ACK';commitDecision(e.id,'ABORT','no committable / committed node exists')}

function primaryWrite(value){let p=S.nodes[S.coordinator];if(!p.alive){log('Primary is down. Promote a new primary.','alert');return}let seq=++p.logIndex;p.pendingWrites[seq]={value:String(value),acks:{}};p.state='WAIT_ACK';log(`${idname(p.id)} issues write #${seq} value=${value} (pending acknowledgments)`,'note');for(let i=0;i<S.n;i++)if(i!==p.id)send(p.id,i,'REPLICATE',{seq,value:String(value)})}

 if(m.type==='REPL_ACK'){if(p.id!==S.coordinator)return;let wr=p.pendingWrites[v.seq];if(!wr)return;wr.acks[m.from]=true;if(Object.keys(wr.acks).length>=S.n-1){p.value=wr.value;p.committed=v.seq;p.state='READY';delete p.pendingWrites[v.seq];S.history.push({seq:v.seq,value:wr.value,from:p.id});log(`★ Write #${v.seq} COMMITTED after all backups ACK`,'note');for(let i=0;i<S.n;i++)if(i!==p.id)send(p.id,i,'REPL_COMMIT',{seq:v.seq})}return}
 if(m.type==='REPL_COMMIT'){p.committed=Math.max(p.committed,v.seq);p.state='READY';return}}

function setNodeField(key,raw){let p=S.nodes[selection];if(!p)return;if(S.mode==='benor'&&((key==='input'&&S.started)||(p.decided!=null&&['decided','a','coin','input'].includes(key))))return;mutate(()=>{let v=raw;if(['promised','acceptedB','clock','local','logIndex','committed','input','a'].includes(key))v=numberOr(v,0);if(key==='crashNext'||key==='byzantine')v=v==='yes';if(key==='vector'){v=raw.split(',').map(x=>Number(x.trim()));if(v.length!==S.n||v.some(x=>!Number.isInteger(x)||x<0))throw Error(`Vector clock must be ${S.n} nonnegative integer entries`)}if(key==='acceptedV'||key==='delivered'){if(v==='')v=null}if(key==='input'&&S.mode==='sync'&&!S.started)p.known=[v];if(key==='crashNext')p.crashRound=null;if(key==='input'&&['paxos','primary'].includes(S.mode)){v=String(raw);delete autoDraft.candidate;}if(key==='vote')v=raw;if(key==='state'){p.log.push('MANUAL SEED → '+v);S.protocolFaults.push('Manual transaction-state seed is not guaranteed reachable.')}const dest=S.mode==='paxos'&&['promised','acceptedB','acceptedV'].includes(key)?ballotState(p):p;if(key==='acceptedB'&&v<0)dest.acceptedV=null;dest[key]=v;if(S.mode==='benor'&&key==='input'&&!S.started)p.a=v;if(S.mode==='snapshot'&&key==='local'&&!S.started){S.initialTotal=S.nodes.reduce((s,x)=>s+x.local,0)+S.queue.filter(m=>m.type==='TRANSFER').reduce((s,m)=>s+m.payload.amount,0)}if(S.mode==='paxos'&&['promised','acceptedB','acceptedV'].includes(key)){scanChosen();log(`Manual acceptor seed P${selection}.${key}=${v} (persisted)`,'alert')}else log(`Edited P${selection}.${key} = ${JSON.stringify(v)}`,'note')})}

const courseModes = ['sync','paxos','benor','trb','twopc','threepc','snapshot','clocks','primary','detector'];
const extras = ['brb','urb'];
const names = {
  sync:'Synchronous crash consensus', paxos:'Paxos', benor:'Ben-Or consensus', trb:'Terminating reliable broadcast',
  twopc:'Two-phase commit', threepc:'Three-phase commit', snapshot:'Chandy–Lamport snapshot', clocks:'Lamport & vector clocks',
  primary:'Primary–backup replication', detector:'Heartbeat failure detector', brb:'Bracha broadcast', urb:'Eager echo broadcast'
};
const goals = {
  sync:'Each survivor chooses its smallest known value after f + 1 rounds.',
  trb:'One sender broadcasts a value. Follow who receives it, who relays it, and when a survivor can deliver the sender-failed symbol (SF).',
  paxos:'Click a node to propose a value. Each slot runs its own prepare and accept phases.',
  benor:'Each process starts with a bit. Follow its A and B messages to see when it keeps an estimate, flips a coin, or decides.',
  snapshot:'Follow the markers to see which token balances and in-flight transfers belong to the same snapshot.',
  clocks:'Send a timestamped message and compare the sender’s clock with the receiver’s clock before and after it arrives.',
  twopc:'Watch participants vote and see when the coordinator can commit or must abort.',
  threepc:'Follow the votes, the precommit, and the acknowledgments that let the coordinator commit.',
  detector:'Advance the heartbeat clock to see how a process can suspect a crashed peer or a slow one.',
  primary:'Follow one write from the primary to its backups and back to the primary for acknowledgment.',
  brb:'Supplemental example. Follow a Byzantine broadcast through INIT, ECHO, and READY messages.',
  urb:'Supplemental example. Follow a message as each first-time recipient forwards it to its peers.'

let currentExample = -1;
function defaultRun(mode){
  if(['benor','twopc','threepc','primary','detector'].includes(mode)){init(mode,3,1);return}
  if(mode==='urb'){init(mode,4,1);return}
  const small = ['sync','trb','clocks','snapshot','brb'].includes(mode);
  init(mode,small ? (['clocks','snapshot'].includes(mode)?3:4) : 5,
    ['clocks','snapshot'].includes(mode)?0:small?1:2);
}
function chooseExample(index){
  if(index < 0) defaultRun(S.mode);
  else {const preset = PRESETS[S.mode]?.[index]; if(!preset) return; preset[2]();}
  currentExample = index;
  S.options.example = index;
  S.options.lastStep = '';
  undoStack = [];
  render();
}

function renderStateTable(){
  const rows=p=>{
    if(S.mode==='sync')return [['Input',p.input],['Known values',p.known],['Decision',p.decided??'—']];
    if(S.mode==='trb')return [['Role',p.id===S.source?'Sender':'Receiver'],['Delivered',p.decided??'—'],['Delivery round',p.deliveryRound??'—']];
    return nodeRows(p);
  };
  const headers=['Process','Status',...rows(S.nodes[0]).map(([key])=>key)];
  const body=S.nodes.map(p=>{
    const planned=p.crashNext?S.round+1:p.crashRound;
    const status=!p.alive?'Crashed':p.halted?'Halted':planned>S.round?'Crashes in round '+planned:'Running';
    const values=rows(p).map(([key,v])=>{
      if(key==='Known values'){
        const gained=S.history.at(-1)?.learned?.[p.id]||[];
        return '<td>'+v.map(value=>gained.includes(value)?'<span class="new-value" title="Learned this round">+'+esc(value)+'</span>':'<span class="known-value">'+esc(value)+'</span>').join(' ')+'</td>';
      }
      return '<td>'+esc(v)+'</td>';
    }).join('');
    return `<tr class="${p.alive?'':'crashed'}"><td><button class="pick" data-select="${p.id}" aria-label="Edit process P${p.id}">P${p.id}</button></td><td>${esc(status)}</td>${values}</tr>`;
  }).join('');
  $('#nodes').innerHTML='<table class="state-table"><thead><tr>'+headers.map(v=>'<th scope="col">'+esc(v)+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table>';
}

const deliveries = {
  PREPARE:['Receive prepare requests','Each available acceptor checks the ballot and replies with its promise or a rejection.'],
  PROMISE:['Collect promises','After a majority replies, the proposer selects the highest previously accepted value reported, or its own if all report none.'],
  ACCEPT:['Process accept requests','Each acceptor checks its promise and records the ballot and value if it can accept. A majority accepting the same pair chooses the value.'],
  LEARN:['Share the chosen value','The proposer tells each reachable learner what the majority chose for this slot.'],
  ACCEPTED:['Collect accepted replies','The proposer learns the chosen value once a majority acknowledges acceptance.'],
  NACK:['Receive ballot rejections','The proposer learns that an acceptor has promised a higher ballot.'],
  A:['Receive A values','Each process uses the first n−f arrivals for its round to form its B value.'],
  B:['Receive B values','Each process uses its first n−f B values to decide, carry a value forward, or flip its coin.'],
  VOTE_REQ:['Ask participants to vote','Each participant records its vote and sends a reply to the coordinator.'],
  VOTE:['Collect votes','A NO forces abort. With all YES votes, 2PC can commit and 3PC can begin precommit.'],
  PRECOMMIT:['Receive precommit','Prepared participants record precommit and acknowledge it.'],
  ACK:['Collect precommit acknowledgments','The coordinator checks whether every required participant has acknowledged precommit.'],
  COMMIT:['Announce commit','Recipients record the coordinator’s commit decision.'], ABORT:['Announce abort','Recipients record the abort decision.'],
  MARKER:['Receive snapshot markers','A first marker records a process’s balance. Later markers close the corresponding incoming channels.'],
  TRANSFER:['Receive the transfer','If the receiver already took its snapshot and this channel is open, it records the transfer in the channel state.'],
  CLOCK:['Receive the timestamped message','The receiver merges the incoming timestamp with its clock and increments its own component.'],
  HEARTBEAT:['Receive heartbeats','Recipients record the arrival and clear suspicions about the senders they hear from.'],
  REPLICATE:['Replicate the write','Backups apply the incoming write and send acknowledgments.'],
  REPL_ACK:['Collect backup acknowledgments','The primary commits the write after all required backups reply.'],
  REPL_COMMIT:['Notify backups of commit','Each backup advances its committed index.'],
  INIT:['Receive the sender’s value','Honest first-time recipients can echo the source value.'],
  ECHO:['Receive echoes','Recipients update their local state using these forwarded messages.'],
  READY:['Receive READY messages','Honest recipients count distinct senders to determine whether to relay or deliver.'],
  STATE_REQ:['Request recovery states','Surviving participants report their transaction states.'], STATE:['Collect recovery states','The new coordinator uses the collected states to select a recovery action.'],
  DECISION_REQ:['Ask peers for a decision','Peers reply with their decision or report uncertainty.'], DECISION:['Receive recorded decisions','Uncertain participants can learn a peer’s decision.'], UNKNOWN:['Receive uncertain replies','These peers have no final transaction decision to report.']

function nextGuide(){
  const active=S.nodes.filter(p=>p.alive), p=S.nodes[S.mode==='paxos'?(S.options.proposer??0):selection];
  const ended=(title,hint)=>({title,hint,label:'Finished'});
  const wait=hint=>({title:'Waiting for progress',hint,label:'Waiting'});
  const step=(title,hint,label,run)=>({title,hint,label,run});
  if(!active.length) return wait('Click any crashed node and choose Recover, or restart the example.');
  if(['sync','trb'].includes(S.mode)){
    const trb=S.mode==='trb';
    if(roundsFinished()){
      const outputs=active.map(p=>p.decided), values=[...new Set(outputs)];
      const title=values.length===1 && values[0]!=null ? `Survivors ${trb?'delivered':'decided'} ${values[0]}` : 'Compare the surviving processes';
      return ended(title,trb?'The delivery round for each survivor is shown below.':'Each survivor applied min to its own set of known values.');
    }
    const k=S.round+1;
    const note=trb?(k===1?`P${S.source} sends “${S.msgValue}”. A receiver can deliver it in this round.`:S.options.earlyStopping?'Processes exchange their current values and track missing senders. Each process checks whether it can safely stop.':'A receiver that just delivered the value relays it. A process still waiting at the final round delivers SF.') :
      (k===1?'Each process sends its input. Look at how its set of known values changes.':`Each live process forwards values it learned and has yet to send.${k===S.f+1?' At the end of this round, each survivor decides the minimum it knows.':''}`);
    return step(`Round ${k} of ${S.f+1}`,note,`Run round ${k}`,()=>mutate(syncRound));
  }
  if(S.mode==='benor')return benGuide();
  const first=S.queue.find(m=>canDeliver(m)&&(S.mode!=='paxos'||(m.payload.slot??1)===activeSlot()));
  if(first){
    const matches=m=>m.type===first.type && (m.payload.slot??1)===(first.payload.slot??1) && m.payload.b===first.payload.b && m.payload.r===first.payload.r && m.payload.seq===first.payload.seq;
    // Only messages present at the start of this step belong to this wave.
    const batch=S.queue.filter(m=>matches(m)&&canDeliver(m));
    const [label,hint]=deliveries[first.type]||['Receive '+first.type,'Apply the pending protocol messages at their recipients.'];
    const suffix=first.payload.r!=null?' · round '+first.payload.r:first.payload.b!=null?' · ballot '+first.payload.b:'';
    return step(label+suffix,hint,label,()=>mutate(()=>{
      for(const m of batch) if(canDeliver(m)) deliver(m.id);
      S.options.lastStep=`${label}: processed ${batch.length} ${first.type} message${batch.length===1?'':'s'}.`;
      if(first.type==='PROMISE'){
        const session=ballotState(S.nodes[first.to],first.payload.slot??1).sessions[first.payload.b];
        if(session?.chosenValue!=null) S.options.lastStep+=` P${first.to} proposed ${session.proposed} and now requests acceptance of ${session.chosenValue}.`;
      }
    }));
  }
  switch(S.mode){
    case 'paxos': {
      const sessions=S.nodes.flatMap(n=>Object.values(ballotState(n).sessions));
      if(sessions.length && sessions.every(s=>s.phase==='chosen'||s.phase==='preempted') && sessions.some(s=>s.phase==='chosen'))return ended('Slot '+activeSlot()+' chose '+chosenHere().at(-1)?.v, 'Add a slot for the next proposal, or click a node to start a higher ballot.');
      if(sessions.length)return wait('This ballot needs a reachable majority. Click a node to propose a higher ballot. '+waitingHint());
      if(!p.alive)return wait('Click a live node and propose a value.');
      const b=Number((selection===p.id?autoDraft.ballot:null)??suggestedBallot(p.id));
      const v=(selection===p.id?autoDraft.candidate:null)??String(p.input);
      if(!Number.isSafeInteger(b)||b<0||String(v)==='')return wait('Enter a nonnegative integer ballot and a candidate value in setup.');
      return step('Start a ballot',`P${p.id} wants to propose ${v} in slot ${activeSlot()}. It first asks the acceptors to promise ballot ${b}.`,'Send prepare requests',()=>mutate(()=>paxosStart(p.id,b,v)));
    }

    case 'snapshot':

function nodeCaption(p){

function renderGraph(){

    const roles=nodeRoles(p),c=coords[i];

    return `<g class="vertex ${p.alive?'':'dead'} ${menuNode===i?'chosen':''} ${p.alive&&(p.decided!=null||p.delivered!=null)?'decided':''}" data-vertex="${i}" transform="translate(${c.x} ${c.y})" role="button" tabindex="0" aria-label="${esc(label)}"><circle class="halo" r="${r+4}"/><g ${p.alive?'':'style="filter:grayscale(.9);opacity:.72"'}>${circleSegments(roles,r,p.alive)}</g><text class="node-name" y="6" text-anchor="middle">P${i}</text><text class="node-caption" y="${r+19}" text-anchor="middle">${esc(short(nodeCaption(p),28))}</text><title>${esc(label)}</title></g>`;
  });
  box.innerHTML=`<svg class="mesh" viewBox="0 0 ${w} ${h}" role="group" aria-label="Nodes and connections">${lines.join('')}${nodes.join('')}</svg>`;
  $('#netCounts').textContent=`${S.nodes.filter(p=>p.alive).length}/${S.n} live · ${lines.length-cut}/${lines.length} links intact`;
  const roles=[...new Set(S.nodes.flatMap(nodeRoles))];
  $('#roleLegend').innerHTML=roles.length<2?'':roles.map(role=>`<span><i style="background:${roleColors[role]}"></i>${role}</span>`).join('');
  $('#graphHint').dataset.defaultHint=nodeHints[S.mode]+' Click a line to cut or restore it.';
  $('#graphHint').textContent=$('#graphHint').dataset.defaultHint;
}
const stateTitles={sync:'Known values',trb:'Broadcast values',paxos:'Slot logs',benor:'Phase receipts',snapshot:'Snapshot balances',clocks:'Logical clocks',twopc:'Transaction states',threepc:'Transaction states',detector:'Suspected peers',primary:'Replica states',urb:'Broadcast values',brb:'Broadcast values'};
function nodeReading(p){
  switch(S.mode){
    case 'sync':return [...p.known].sort((a,b)=>a-b);
    case 'trb':return [p.decided??(p.id===S.source?S.msgValue:'—')];
    case 'urb':return [p.delivered!=null?'Delivered '+p.delivered:p.id===S.source?'Send '+S.msgValue:'Waiting'];
    case 'brb':return [p.delivered!=null?'Delivered '+p.delivered:p.readied!=null?'Ready '+p.readied:p.echoed!=null?'Echoed '+p.echoed:p.id===S.source?'Send '+S.msgValue:'Waiting'];
    case 'benor':return ['A '+p.a,...(S.started?['B '+(p.b??'⊥')]:[])];
    case 'snapshot':return ['local '+p.local,...(p.recorded?['saved '+p.snapshotLocal,'in transit '+Object.values(p.channels).flat().reduce((sum,m)=>sum+m.amount,0)]:[])];
    case 'clocks':return ['L '+p.clock,'['+p.vector.join(', ')+']'];
    case 'twopc':case 'threepc':return [p.state,...(p.id!==S.coordinator?['vote '+p.vote]:[])];
    case 'primary':return [String(p.value),'log #'+p.logIndex,'commit #'+p.committed];
    case 'detector':return p.suspects.length?p.suspects.map(idname):['none'];
  }
}
function allSlots(){return Object.keys(S.nodes[0].slots).map(Number).sort((a,b)=>a-b)}
function renderValues(){
  const isPaxos=S.mode==='paxos';
  $('.workbench').classList.toggle('paxos',isPaxos);
  $('.workbench').classList.toggle('benor',S.mode==='benor');
  $('#slotTools').hidden=!isPaxos;
  $('#stateLabel').textContent=stateTitles[S.mode];
  $('#stateTime').textContent=isPaxos?'per process':!isAsync()?'Round '+S.round:'';
  const fresh=S.mode==='sync'?S.history.at(-1)?.learned||{}:{};
  $('#valueKey').textContent=Object.values(fresh).some(v=>v.length)?'Green values arrived this round.':'';
  if(S.mode==='benor'){benPanel();return}
  if(isPaxos){
    const slots=allSlots();
    $('#slotPick').innerHTML=slots.map(s=>`<option value="${s}">${s}</option>`).join('');
    $('#slotPick').value=String(activeSlot());
    $('#nodeValues').innerHTML=S.nodes.map(p=>{
      const rows=slots.map(s=>{
        const r=ballotState(p,s);
        return `<tr class="${s===activeSlot()?'active-slot':''}"><td>${s}</td><td>${r.promised<0?'—':esc(r.promised)}</td><td>${r.acceptedB<0?'—':esc(r.acceptedV)+' @ '+esc(r.acceptedB)}</td><td>${esc(r.learned??'—')}</td></tr>`;
      }).join('');
      return `<section class="log-block" aria-label="Slot log for P${p.id}"><div class="log-node"><button data-vertex="${p.id}"><i class="swatch" style="--node-color:${roleColors[nodeRoles(p)[0]]}"></i>P${p.id}</button><small>${p.alive?'':'Crashed'}</small></div><table class="slot-log"><thead><tr><th>Slot</th><th>Promise</th><th>Accepted @ ballot</th><th>Learned</th></tr></thead><tbody>${rows}</tbody></table></section>`;
    }).join('');
    return;
  }
  $('#nodeValues').innerHTML=S.nodes.map(p=>{
    const values=nodeReading(p).map(v=>`<span class="atom ${(fresh[p.id]||[]).includes(v)?'fresh':''}">${esc(v)}</span>`).join('');
    const when=p.crashNext?S.round+1:p.crashRound;
    const status=!p.alive?'Crashed':when>S.round?'Crash in round '+when:'';
    const detail=nodeDetail(p);
    const decision=p.decided!=null?(S.mode==='trb'?'Delivered':'Decided')+' '+p.decided:'';
    return `<button class="value-row ${p.alive?'':'crashed'}" data-vertex="${p.id}"><span><span class="who"><i class="swatch" style="--node-color:${p.alive?roleColors[nodeRoles(p)[0]]:'#888'}"></i>P${p.id}</span><small class="dead-note">${esc(status)}</small></span><span class="vals">${values}${detail?'<span class="state-detail">'+esc(detail)+'</span>':''}${decision?'<span class="decision-note">'+esc(decision)+'</span>':''}</span></button>`;
  }).join('');
}
function reportState(guide){
  let text=S.options.lastStep||guide.hint;
  if(!guide.run)text=guide.title+'. '+guide.hint;
  let warning='';
  if(S.mode==='benor' && S.options.lastStep && guide.run)text+=' '+guide.hint;
  if(!isAsync()){
    const live=S.nodes.filter(p=>p.alive),decisions=[...new Set(live.map(p=>p.decided))];
    if(!live.length)text='All nodes have crashed.';
    else if(roundsFinished())text=decisions.length===1&&decisions[0]!=null?`Agreement. All ${live.length} surviving node${live.length===1?'':'s'} ${S.mode==='trb'?'delivered':'decided'} ${decisions[0]}.`:'Survivors have different outcomes. Compare their values on the right.';
    if(Object.values(S.network).some(Boolean)||S.options.missedRoundTraffic)warning=' The lecture guarantee assumes reliable links.';
    if(S.n-live.length>S.f)warning+=' Crashes exceed f.';
    if(S.options.recoveredMidRun)warning+=' This run includes recovery after a crash.';
  }
  $('#resultLine').textContent=text+warning;
  $('#resultLine').classList.toggle('alerted',Boolean(warning));
}
function dismissNode(focus=false){
  const old=menuNode;menuNode=null;$('#nodeMenu').hidden=true;
  const vertex=$('#graph [data-vertex="'+old+'"]');
  vertex?.classList.remove('chosen');
  if(focus)vertex?.focus();
}
function positionNodeMenu(){
  if(menuNode==null)return;
  const anchor=$('#graph [data-vertex="'+menuNode+'"]');
  if(!anchor)return dismissNode();
  const rect=anchor.getBoundingClientRect(),menu=$('#nodeMenu');
  const left=rect.right+12+menu.offsetWidth<innerWidth?rect.right+10:rect.left-menu.offsetWidth-10;
  menu.style.left=Math.max(8,Math.min(innerWidth-menu.offsetWidth-8,left))+'px';
  menu.style.top=Math.max(8,Math.min(innerHeight-menu.offsetHeight-8,rect.top-8))+'px';
}
function renderNodeMenu(){
  if(menuNode==null)return;
  const p=S.nodes[menuNode];if(!p)return dismissNode();
  const m=$('#nodeMenu'),roles=nodeRoles(p);
  m.hidden=false;m.setAttribute('aria-label','Controls for P'+p.id);
  let field='';
  if((S.mode==='sync'||S.mode==='benor')&&!S.started){
    const input=S.mode==='benor'?`<select id="quickInput"><option ${p.input===0?'selected':''}>0</option><option ${p.input===1?'selected':''}>1</option></select>`:`<input id="quickInput" type="number" step="any" value="${esc(p.input)}" required>`;
    field=`<form id="inputForm" class="node-form"><label for="quickInput">Initial value</label>${input}<button>Save</button></form>`;
  }
  if(S.mode==='paxos'){
    const draft=autoDraft.candidate??p.input;
    field=`<form class="node-form pax-form" id="proposeForm"><label>Ballot<input id="quickBallot" type="number" min="0" step="1" value="${esc(autoDraft.ballot??suggestedBallot(p.id))}" required></label><label>Value<input id="quickProposal" value="${esc(draft)}" required></label><button ${p.alive?'':'disabled'}>Propose in slot ${activeSlot()}</button></form>`;
  }
  if((S.mode==='trb'||S.mode==='brb')&&!S.started){
    field=`<form class="node-form" id="sourceForm"><label for="quickMessage">Message</label><input id="quickMessage" value="${esc(S.msgValue)}" required><button>Set sender</button></form>`;
  }
  if(['twopc','threepc'].includes(S.mode) && p.id!==S.coordinator && p.state==='INIT'){
    field=`<label class="node-form">Vote <select id="quickVote"><option ${p.vote==='YES'?'selected':''}>YES</option><option ${p.vote==='NO'?'selected':''}>NO</option></select></label>`;
  }
  const destinations=S.nodes.filter(n=>n.id!==p.id);
  const target='<select id="quickTarget" aria-label="Destination">'+destinations.map(n=>'<option value="'+n.id+'">P'+n.id+'</option>').join('')+'</select>';
  let actions='';
  if(S.mode==='clocks'||S.mode==='snapshot'){
    const clock=S.mode==='clocks';
    actions='<form class="quick-send" id="quickSend"><label>Send to '+target+'</label>'+
      (clock?'':'<label>Tokens <input id="quickTokens" type="number" min="1" max="'+Number(p.local)+'" value="'+Math.min(p.local,3)+'" required></label>')+
      '<button '+(p.alive?'':'disabled')+'>'+(clock?'Send timestamp':'Send transfer')+'</button></form>';
    if(clock||!S.started)actions+='<button class="node-action" data-quick="'+(clock?'clock-local':'begin-snapshot')+'" '+(p.alive?'':'disabled')+'>'+(clock?'Local event':'Record snapshot here')+'</button>';
  }
  if(S.mode==='benor'&&p.decided!=null)actions='<p class="locked-text">Decision locked at '+esc(p.decided)+'</p>';
  if(S.mode==='benor'&&p.decided==null)actions='<label class="node-form">Coin flip <select id="quickCoin">'+['random','0','1'].map(v=>'<option '+(String(p.coin)===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>';
  if(S.mode==='threepc' && p.alive && !alive(S.coordinator))actions='<button class="node-action" data-quick="elect">Elect P'+p.id+' coordinator</button>';
  if(S.mode==='twopc' && p.alive && p.state==='PREPARED')actions='<button class="node-action" data-quick="ask">Ask peers for a decision</button>';
  if(S.mode==='primary' && p.alive){
    actions=p.id===S.coordinator?'<form class="node-form" id="quickWrite"><label for="quickData">New value</label><input id="quickData" value="99" required><button>Write</button></form>':'<button class="node-action" data-quick="promote">Promote to primary</button>';
  }
  if(S.mode==='detector')actions='<small>Suspects '+esc(p.suspects.map(idname).join(', ')||'no peers')+'</small>';

  if(S.mode==='brb')actions='<label class="node-form">Byzantine <select id="quickByzantine"><option '+(!p.byzantine?'selected':'')+'>no</option><option '+(p.byzantine?'selected':'')+'>yes</option></select></label>';
  if(S.mode==='snapshot'&&!S.started&&!S.queue.some(m=>m.type==='TRANSFER')){
    field='<form id="balanceForm" class="node-form"><label for="startBalance">Initial tokens</label><input type="number" min="0" step="1" id="startBalance" value="'+p.local+'" required><button>Save</button></form>';
  }
  if(S.mode==='urb'&&!S.started){
    const selected=p.id===S.source?firstRecipients(p.id):destinations.map(n=>n.id);
    field='<form id="sourceForm" class="source-form"><label>Message <input id="quickMessage" required value="'+esc(S.msgValue)+'"></label><fieldset><legend>First recipients</legend>'+destinations.map(n=>'<label><input name="firstPeer" type="checkbox" value="'+n.id+'" '+(selected.includes(n.id)?'checked':'')+'>P'+n.id+'</label>').join('')+'</fieldset><button>Set sender and recipients</button></form>';
  }
  if(S.mode==='brb'&&p.byzantine&&p.alive){
    const types=p.id===S.source?['INIT','ECHO','READY']:['ECHO','READY'];
    actions+='<form id="byzantineSend" class="source-form"><label>Send to '+target+'</label><label>Message <select id="quickType">'+types.map(type=>'<option>'+type+'</option>').join('')+'</select></label><label>Value <input id="quickPayload" value="A" required></label><button>Send to one peer</button></form>';
  }
  if(['twopc','threepc'].includes(S.mode)&&p.alive&&['COMMITTED','ABORTED'].includes(p.state))actions+='<button class="node-action" data-quick="replay">Resend logged decision</button>';
  if(S.mode==='detector'&&p.alive)actions+='<p class="node-receipts">Last heartbeat by tick<br>'+destinations.map(n=>'P'+n.id+' · '+(p.last[n.id]||'none')).join(' / ')+'</p>';
  if(!isAsync()&&p.alive&&!roundsFinished()){
    const marked=parseRecipients(p.partial);
    const checks=destinations.filter(n=>n.alive).map(n=>'<label><input type="checkbox" name="recipient" value="'+n.id+'" '+(marked.includes(n.id)?'checked':'')+'>P'+n.id+'</label>').join('');
    const planned=p.crashNext?S.round+1:p.crashRound;
    actions+='<details id="partialSend"><summary>Crash during a round</summary><form id="crashForm"><p>Send only to these nodes before crashing.</p><div class="links-list">'+checks+'</div><button>Schedule for round '+(S.round+1)+'</button></form></details>';
    if(planned>S.round)actions+='<p class="node-plan">Crash scheduled for round '+planned+' <button id="cancelCrash">Cancel</button></p>';
  }
  const incoming='<details id="incomingLinks"><summary>Receive from</summary><div class="links-list">'+destinations.map(n=>{
    const cut=Boolean(S.network[n.id+'-'+p.id]);
    return '<button class="'+(cut?'cut':'')+'" data-incoming="'+n.id+'" aria-pressed="'+!cut+'">'+(cut?'× ':'✓ ')+'P'+n.id+'</button>';
  }).join('')+'</div><small>Each button changes only the link into P'+p.id+'.</small></details>';
  const peers=destinations.map(n=>{
    const cut=linkState(p.id,n.id)!=='up';
    return `<button type="button" class="${cut?'cut':''}" data-wire="${p.id},${n.id}" aria-label="${cut?'Restore':'Cut'} connection to P${n.id}">${cut?'×':'↔'} P${n.id}</button>`;
  }).join('');
  m.innerHTML=`<div class="menu-head"><strong>P${p.id}</strong><small>${p.alive?'Running':'Crashed'}</small><button class="menu-close" id="closeNode" aria-label="Close node controls">×</button></div>${roles.length>1?'<small>'+roles.join(' · ')+'</small>':''}${field}${actions}${nodeInbox(p)}<button class="node-action ${p.alive?'kill':'restore'}" id="killNode">${p.alive?'Crash':'Recover'} P${p.id}</button>${incoming}<details id="peerLinks"><summary>Connections</summary><div class="links-list">${peers}</div></details><button class="menu-more" id="editFullNode">More node options</button>`;
  positionNodeMenu();
}
function openNode(id){
  if(menuNode===id){dismissNode(true);return}
  menuNode=id;if(selection!==id)autoDraft={};selection=id;render();
  $('#closeNode').focus({preventScroll:true});
}
function activateWire(el){
  const [a,b]=el.dataset.wire.split(',').map(Number);
  const menuLink=Boolean(el.closest('#nodeMenu'));
  if(!menuLink)dismissNode();
  toggleWire(a,b);
  if(menuLink){$('#peerLinks').open=true;positionNodeMenu()}
  const replacement=$(menuLink?'#nodeMenu [data-wire="'+a+','+b+'"]':'#graph [data-wire="'+a+','+b+'"]');
  replacement?.focus({preventScroll:true});
  $('#graphHint').textContent=edgeHint(a,b);
}
function changeSlot(slot){
  S.options.slot=slot;autoDraft={};dismissNode();render();
}
$('#slotPick').addEventListener('change',e=>changeSlot(Number(e.target.value)));
$('#addSlot').addEventListener('click',()=>{
  dismissNode();autoDraft={};
  mutate(()=>{
    const next=Math.max(...allSlots())+1;
    for(const p of S.nodes)p.slots[next]=emptySlot();
    S.options.slot=next;
    log('Opened slot '+next+'.','note');
  });
});
document.addEventListener('click',e=>{
  const vertex=e.target.closest('[data-vertex]'),wire=e.target.closest('[data-wire]');
  if(vertex){openNode(Number(vertex.dataset.vertex));return}
  if(wire){activateWire(wire);return}
  if(!e.target.closest('#nodeMenu')){if(menuNode!=null)dismissNode();return}
  if(e.target.id==='closeNode')dismissNode(true);
  if(e.target.hasAttribute('data-incoming')){
    const from=Number(e.target.dataset.incoming),to=menuNode,key=from+'-'+to;
    mutate(()=>{if(S.network[key])delete S.network[key];else S.network[key]=true;log('Changed incoming link P'+from+' → P'+to,'note')});
    $('#incomingLinks').open=true;positionNodeMenu();
    $('#nodeMenu [data-incoming="'+from+'"]').focus();
  }
  if(e.target.dataset.quick){
    const cmd=e.target.dataset.quick,id=menuNode;
    restartPoint??=captureRun();
    if(cmd==='clock-local')mutate(()=>clockStep(id));
    if(cmd==='begin-snapshot')mutate(()=>snapshotInitiate(id));
    if(cmd==='elect')mutate(()=>threepcElect(id));
    if(cmd==='ask')mutate(()=>askDecision(id));
    if(cmd==='replay')mutate(()=>replayDecision(id));
    if(cmd==='promote')mutate(()=>primaryElect(id));
    dismissNode(true);
  }
  if(e.target.id==='cancelCrash'){
    const n=S.nodes[menuNode];mutate(()=>{n.crashNext=false;n.crashRound=null});dismissNode(true);
  }
  if(e.target.id==='killNode'){
    const id=menuNode;
    toggleCrash(id);
    dismissNode(true);
  }
  if(e.target.id==='editFullNode'){
    const id=menuNode;dismissNode();selectProcess(id);
    $('#advancedSetup').open=true;
    $('#processPicker').focus();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&menuNode!=null){dismissNode(true);return}
  if(!['Enter',' '].includes(e.key) || !e.target.closest('svg'))return;
  const vertex=e.target.closest('[data-vertex]'),wire=e.target.closest('[data-wire]');
  if(!vertex&&!wire)return;
  e.preventDefault();
  if(vertex)openNode(Number(vertex.dataset.vertex));else activateWire(wire);
});
$('#nodeMenu').addEventListener('submit',e=>{
  e.preventDefault();
  if(menuNode==null)return;
  const id=menuNode;
  if(e.target.id==='nodeInbox'){
    const message=Number($('#incomingPacket').value);
    if(S.queue.some(m=>m.id===message&&canDeliver(m)))doDeliver(message);
  }else if(e.target.id==='balanceForm'){
    setNodeField('local',Number($('#startBalance').value));
  }else if(e.target.id==='byzantineSend'){
    const to=Number($('#quickTarget').value),type=$('#quickType').value,v=$('#quickPayload').value;
    restartPoint??=captureRun();mutate(()=>brbCorrupt(id,to,type,v));
  }else if(e.target.id==='crashForm'){
    const dests=[...e.target.querySelectorAll(':checked')].map(input=>input.value);
    mutate(()=>{const n=S.nodes[id];n.crashNext=true;n.crashRound=null;n.partial=dests.join(',');S.options.lastStep='P'+id+' will send to '+(dests.map(i=>'P'+i).join(', ')||'nobody')+' before crashing next round.';});
  }else if(e.target.id==='quickSend'){
    const target=Number($('#quickTarget').value),tokens=Number($('#quickTokens')?.value);
    restartPoint??=captureRun();
    if(S.mode==='clocks')mutate(()=>clockStep(id,'SEND',target));
    else mutate(()=>snapshotTransfer(id,target,tokens));
  }else if(e.target.id==='quickWrite'){
    const value=$('#quickData').value;restartPoint??=captureRun();mutate(()=>primaryWrite(value));
  }else if(e.target.id==='inputForm'){
    const value=Number($('#quickInput').value);
    if(Number.isFinite(value))setNodeField('input',value);
  }else if(e.target.id==='proposeForm'){
    const b=Number($('#quickBallot').value),v=$('#quickProposal').value;
    restartPoint??=captureRun();
    mutate(()=>paxosStart(id,b,v));
  }else if(e.target.id==='sourceForm'){
    const v=$('#quickMessage').value.trim();
    if(!v || (S.mode==='trb'&&v==='SF')){$('#quickMessage').setCustomValidity('Enter a message distinct from SF.');$('#quickMessage').reportValidity();return}
    const peers=[...e.target.querySelectorAll('input[name="firstPeer"]:checked')].map(x=>Number(x.value));
    mutate(()=>{S.source=id;S.msgValue=v;if(S.mode==='urb')S.options.firstRecipients=peers;S.options.lastStep='P'+id+' will broadcast '+v+'.'});
  }
  dismissNode(true);
});
$('#nodeMenu').addEventListener('input',e=>e.target.setCustomValidity?.(''));
$('#nodeMenu').addEventListener('change',e=>{
  if(e.target.id==='quickCoin'){setNodeField('coin',e.target.value);dismissNode(true)}
  if(e.target.id==='quickByzantine'){setNodeField('byzantine',e.target.value);dismissNode(true)}
  if(e.target.id==='quickVote'){setNodeField('vote',e.target.value);dismissNode(true)}
});
for(const event of ['pointerover','focusin'])$('#graph').addEventListener(event,e=>{
  const wire=e.target.closest('[data-wire]');
  if(wire)$('#graphHint').textContent=edgeHint(...wire.dataset.wire.split(',').map(Number));
});
for(const event of ['pointerout','focusout'])$('#graph').addEventListener(event,e=>{
  if(!e.relatedTarget?.closest?.('[data-wire]'))$('#graphHint').textContent=$('#graphHint').dataset.defaultHint||graphInstructions;
});
window.addEventListener('scroll',positionNodeMenu,{passive:true});
new ResizeObserver(()=>{if(S){renderGraph();positionNodeMenu()}}).observe($('#graph'));

const requestedMode=new URLSearchParams(location.search).get('sim');
defaultRun(Object.hasOwn(MODES,requestedMode)?requestedMode:'sync');
